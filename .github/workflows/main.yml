name: Deploy para o Firebase Hosting

on:
  push:
    branches:
      - main # Executa a automação sempre que houver push na branch main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instala as dependências do projeto Vue
      - name: Instalar dependências
        run: npm ci

      # 4. Gera a build de produção do Vue (cria a pasta 'dist')
      - name: Gerar Build do Vue 3
        run: npm run build

      # 5. Faz o deploy para o Firebase Hosting
      - name: Deploy para Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: SEU_PROJECT_ID_AQUI # Substitua pelo ID exato do seu projeto no Firebase
